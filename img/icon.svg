<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B3CF0"/>
      <stop offset=".55" stop-color="#E2457A"/>
      <stop offset="1" stop-color="#FF9F3D"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".25" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD25A"/>
      <stop offset=".5" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#E5383B"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5383B"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <clipPath id="tube"><path d="M-38 -150 V110 a38 38 0 0 0 76 0 V-150 Z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- dökülen akış -->
  <path d="M306 134 C 328 172, 324 236, 318 292" stroke="url(#stream)" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- karışım damlası -->
  <g transform="translate(318 372) scale(.86)">
    <path d="M0 -95 C40 -40 78 0 78 40 a78 78 0 0 1 -156 0 C-78 0 -40 -40 0 -95Z" fill="url(#drop)"/>
    <path d="M-42 28 a42 42 0 0 0 38 48" stroke="#fff" stroke-opacity=".7" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>

  <!-- eğik tüp -->
  <g transform="translate(182 216) rotate(55)">
    <g clip-path="url(#tube)">
      <rect x="-40" y="-150" width="80" height="300" fill="#fff" fill-opacity=".35"/>
      <rect x="-40" y="50" width="80" height="110" fill="#2F6FED"/>
      <rect x="-40" y="-10" width="80" height="60" fill="#FFC93C"/>
      <rect x="-40" y="-70" width="80" height="60" fill="#E5383B"/>
    </g>
    <path d="M-38 -150 V110 a38 38 0 0 0 76 0 V-150" fill="none" stroke="#fff" stroke-width="10"/>
    <rect x="-48" y="-162" width="96" height="18" rx="9" fill="#fff"/>
    <rect x="-24" y="-120" width="10" height="190" rx="5" fill="#fff" fill-opacity=".6"/>
  </g>

  <!-- pırıltılar -->
  <path d="M420 92 l9 25 25 9 -25 9 -9 25 -9 -25 -25 -9 25 -9z" fill="#fff"/>
  <path d="M96 392 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#fff" fill-opacity=".85"/>
  <path d="M440 300 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" fill="#fff" fill-opacity=".8"/>
</svg>
